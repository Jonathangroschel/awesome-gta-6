name: Check links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["**/*.md", "data/*.json"]

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,201,202,204,206,301,302,403,429,999
            --fallback-extensions md
            --max-retries 3
            --timeout 30
            --exclude "teekamsuthar.com/awesome-gta-6"
            --exclude "localhost"
            --exclude "support.rockstargames.com"
            "./**/*.md" "./data/*.json"
          fail: ${{ github.event_name == 'pull_request' }}
      - name: Open an issue if links broke
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: broken-links
